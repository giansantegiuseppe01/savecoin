name: savecoin_pos
description: SaveCoin POS - Sistema de Punto de Venta para Restaurantes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # UUID Generation
  uuid: ^4.2.1
  
  # HTTP Requests
  http: ^1.1.0
  dio: ^5.3.4
  
  # Bluetooth Printing
  flutter_blue_plus: ^1.31.5
  esc_pos_utils: ^1.1.0
  esc_pos_printer: ^0.3.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
